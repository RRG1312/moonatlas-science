[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonatlas-science"
version = "0.3.1"
description = "Reproducible pipeline for running published NASA-IBM Lunar Foundation Model checkpoints and normalizing their outputs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
keywords = ["lunar", "remote-sensing", "foundation-models", "geospatial", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
# Core dependencies are the ones the contract, geometry and validation need. Inference additionally needs the
# upstream package (torch, terratorch, lightning, rasterio, huggingface-hub), installed by
# `python scripts/setup_environment.py` at the pinned revision — it is not vendored here.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10",
  "pyarrow>=15",      # SomBench metadata.parquet
  "pyproj>=3.7,<4",
  "pyyaml>=6",
  "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]
reports = ["matplotlib>=3.8"]   # diagnostic figures only

[project.scripts]
moonatlas-science = "moonatlas_science.cli:main"

[project.urls]
Homepage = "https://github.com/RRG1312/moonatlas-science"
Issues = "https://github.com/RRG1312/moonatlas-science/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/moonatlas_science"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "upstream: needs downloaded upstream models or SomBench samples (level 2/3, excluded from CI)",
]
addopts = "-m 'not upstream'"

[tool.ruff]
line-length = 127
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Pragmatic set for a scientific codebase: real errors, undefined names, unused imports and import order.
# Style-only rules (line length, bugbear opinions) are deliberately not enforced on inherited pipeline code;
# tightening them is welcome as its own pull request, never mixed with a science change.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells import after a setup cell on purpose.
"notebooks/*.ipynb" = ["E402"]
# Steps and reports are scripts: a module docstring then imports, with the pipeline's own ordering.
"src/moonatlas_science/steps/*.py" = ["E402"]
"src/moonatlas_science/reports/*.py" = ["E402"]
