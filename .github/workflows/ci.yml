name: CI

on:
  push:
    branches: [main]
  pull_request:

# The fast suite only: no checkpoints, no SomBench downloads, no GPU.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (fast suite)
        run: pytest -q
      - name: Validate the example dataset
        run: moonatlas-science validate --root examples/science-smoke --scope published
      - name: Contract export is in sync
        run: |
          python -m moonatlas_science.contracts > /tmp/contract.json
          diff -u schemas/contract-v2.json /tmp/contract.json
      - name: No upstream binaries committed
        run: |
          if git ls-files | grep -E '\.(ckpt|pt|pth|safetensors|tif|tiff|npy|npz)$'; then
            echo "upstream binaries must not be committed"; exit 1
          fi
